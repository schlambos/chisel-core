[package]
name = "chisl-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "chislcore"
path = "src/main.rs"

[features]
default = ["telegram"]
telegram = ["chisl-channel/telegram"]

[dependencies]
chisl-common = { workspace = true, features = ["axum"] }
chisl-assets.workspace = true
chisl-db.workspace = true
chisl-api-types.workspace = true
chisl-realtime.workspace = true
chisl-lsp.workspace = true
chisl-auth.workspace = true
chisl-system.workspace = true
chisl-file.workspace = true
chisl-office.workspace = true
chisl-shell.workspace = true
chisl-ai-agent.workspace = true
chisl-mcp.workspace = true
chisl-conversation.workspace = true
chisl-extension.workspace = true
chisl-channel.workspace = true
chisl-team.workspace = true
chisl-cron.workspace = true
chisl-assistant.workspace = true
chisl-terminal.workspace = true
chisl-runtime.workspace = true
aion-config.workspace = true
axum.workspace = true
dirs.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest.workspace = true
rmcp = { version = "1.5", features = ["server", "transport-io", "schemars"] }
anyhow.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true

[dev-dependencies]
chisl-api-types.workspace = true
chisl-realtime.workspace = true
# Enable the `AgentInstance::Mock` variant so tests can build fake agents
# through the trait-object escape hatch without spawning real CLI processes.
chisl-ai-agent = { workspace = true, features = ["test-support"] }
async-trait.workspace = true
base64.workspace = true
git2.workspace = true
http-body-util.workspace = true
rust_xlsxwriter.workspace = true
tempfile = "3"
tower = { workspace = true, features = ["util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
wiremock = "0.6"
