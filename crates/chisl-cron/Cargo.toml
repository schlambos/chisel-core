[package]
name = "chisl-cron"
version.workspace = true
edition.workspace = true

[dependencies]
chisl-common = { workspace = true, features = ["axum"] }
chisl-db.workspace = true
chisl-api-types.workspace = true
chisl-realtime.workspace = true
chisl-conversation.workspace = true
chisl-ai-agent.workspace = true
chisl-auth.workspace = true
chisl-system.workspace = true
axum.workspace = true
cron.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
dashmap.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# Enable the `AgentInstance::Mock` variant so tests can build fake agents
# through the trait-object escape hatch without spawning real CLI processes.
chisl-ai-agent = { workspace = true, features = ["test-support"] }
