name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  opencode-protocol:
    name: OpenCode SSE Protocol Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: AionCore
      - name: Run conformance suite
        working-directory: AionCore
        run: cargo test -p aionui-opencode-conformance --all-targets
