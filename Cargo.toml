[workspace]
resolver = "3"
members = [
  "crates/chisl-assets",
  "crates/chisl-common",
  "crates/chisl-db",
  "crates/chisl-api-types",
  "crates/chisl-realtime",
  "crates/chisl-runtime",
  "crates/chisl-lsp",
  "crates/chisl-auth",
  "crates/chisl-system",
  "crates/chisl-file",
  "crates/chisl-office",
  "crates/chisl-shell",
  "crates/chisl-ai-agent",
  "crates/chisl-mcp",
  "crates/chisl-conversation",
  "crates/chisl-extension",
  "crates/chisl-channel",
  "crates/chisl-team",
  "crates/chisl-cron",
  "crates/chisl-assistant",
  "crates/chisl-app",
  "crates/chisl-opencode-conformance",
  "crates/chisl-terminal",
]

[workspace.package]
version = "0.1.12"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
chisl-common = { path = "crates/chisl-common", default-features = false }
chisl-assets = { path = "crates/chisl-assets" }
chisl-db = { path = "crates/chisl-db" }
chisl-api-types = { path = "crates/chisl-api-types" }
chisl-realtime = { path = "crates/chisl-realtime" }
chisl-runtime = { path = "crates/chisl-runtime" }
chisl-lsp = { path = "crates/chisl-lsp" }
chisl-auth = { path = "crates/chisl-auth" }
chisl-system = { path = "crates/chisl-system" }
chisl-file = { path = "crates/chisl-file" }
chisl-office = { path = "crates/chisl-office" }
chisl-shell = { path = "crates/chisl-shell" }
chisl-ai-agent = { path = "crates/chisl-ai-agent" }
chisl-mcp = { path = "crates/chisl-mcp" }
chisl-conversation = { path = "crates/chisl-conversation" }
chisl-extension = { path = "crates/chisl-extension" }
chisl-channel = { path = "crates/chisl-channel" }
chisl-team = { path = "crates/chisl-team" }
chisl-cron = { path = "crates/chisl-cron" }
chisl-assistant = { path = "crates/chisl-assistant" }
chisl-app = { path = "crates/chisl-app" }
chisl-terminal = { path = "crates/chisl-terminal" }

aion-agent = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.1.27" }
aion-types = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.1.27" }
aion-protocol = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.1.27" }
aion-config = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.1.27" }
aion-mcp = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.1.27" }

# Core framework
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
http = "1"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async utilities
futures-util = "0.3"

# Async trait (dyn-compatible async traits)
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Auth / Crypto
jsonwebtoken = "9"
bcrypt = "0.17"
aes-gcm = "0.10"

# UUID
uuid = { version = "1", features = ["v7"] }

# HTTP client — use rustls to avoid native OpenSSL dep during cross-compilation
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }

# Network interface enumeration (local fs MCP reachability candidates)
if-addrs = "0.13"

# Concurrency
dashmap = "6"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

# Protobuf
prost = "0.13"

# Semver
semver = "1"

# Directories
dirs = "6"

# Regex
regex = "1"

# Diff/Patch
diffy = "0.5"

# File system
include_dir = "0.7"
notify = "8"
walkdir = "2"
ignore = "0.4"
zip = "2"
git2 = { version = "0.20", default-features = false }
mime_guess = "2"
rust-embed = "8"

# Runtime embedding
fs2 = "0.4"
zstd = "0.13"

# Cron
cron = "0.15"
chrono = "0.4"
chrono-tz = "0.10"

# Shell
open = "5"
which = "7"

# Office
calamine = "0.26"
rust_xlsxwriter = "0.82"
sha1 = "0.10"
sha2 = "0.10"

# AWS
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrock = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }

# TLS
rustls = "0.23"
rustls-native-certs = "0.8"

# Pin rustls-webpki to fix RUSTSEC-2026-{0098,0099,0104}
rustls-webpki = "0.103.13"

# PTY for terminal sessions
portable-pty = "0.6"

# OAuth / MCP
oauth2 = "5.0.0-rc.1"
toml = "0.8"

# Ed25519
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Encoding
base64 = "0.22"

# HTTP body utilities (testing)
http-body-util = "0.1"

# Testing
tempfile = "3"
wiremock = "0.6"

# Random
getrandom = "0.2"
hex = "0.4"

# Shrink target/debug: minimal debuginfo, sidecar files, no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false
